<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomás Becerra</title>
<meta name="description" content="Tomás Becerra: narrative and systems designer, writer, draughtsman and singer, based in Rome. Kingdom of None, seven short stories, an essay, a CV and experimental music, on one wall.">
<meta name="theme-color" content="#111111">
<meta property="og:type" content="website">
<meta property="og:title" content="Tomás Becerra">
<meta property="og:description" content="Narrative and systems designer, trained in the implications of words. Kingdom of None, seven short stories, an essay, a CV and experimental music, on one wall.">

<style>
/* Each territory keeps the typeface of its own world; they only show their names when you come close. */
@font-face{font-family:'Pirata One';src:url(landing/fonts/pirata-one-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;src:url(landing/fonts/cormorant-garamond-latin-500-italic.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IM Fell English';font-style:italic;src:url(landing/fonts/im-fell-english-latin-400-italic.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Anton';src:url(landing/fonts/anton-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Permanent Marker';src:url(landing/fonts/permanent-marker-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Archivo';font-weight:100 900;font-stretch:62% 125%;src:url(landing/archivo.woff2) format('woff2');font-display:swap}

:root{
  --ink:#121212;
  --green:#17b85a; --purple:#c21ee0; --yellow:#f2dc2e; --blue:#12a9f0; --red:#e3392b;
  --cream:#f4ecd8;
  --lv:0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}

/* one screen, no scrolling: the wall */
.wall{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.reg{position:absolute;inset:0;display:block;text-decoration:none;-webkit-tap-highlight-color:transparent;outline:none}
a.reg{cursor:pointer}
.media{position:absolute;overflow:hidden;display:block}
.media>img,.media>video,.media>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.media>video{opacity:0;transition:opacity .5s ease}
.media>video.live{opacity:1}
.reg .media>img{transition:filter .6s ease}
.wall.has-on .reg:not(.on) .media>img,.wall.has-on .reg:not(.on) .media>canvas.op{filter:saturate(.75) brightness(.78)}

.r-kon .media>img{object-position:50% 46%}
.r-why .media>img{object-position:44% 50%}
.r-cv .media>img{object-position:50% 0}
.r-toa{pointer-events:none}
.r-toa .media>img{transition:filter .8s ease,opacity .5s ease}
.r-toa.playing .media>img{filter:brightness(.42) saturate(.85)}
.r-toa .media>img.swap{opacity:0}
.r-toa .media>canvas{pointer-events:none}

/* the names, each in its own letter, only when you come close (always on a touch screen) */
.tags{position:absolute;inset:0;pointer-events:none;z-index:6}
.tag{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));white-space:nowrap;opacity:0;transition:opacity .35s ease;
  padding:.18em .5em .22em;line-height:1.05;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.tag.on{opacity:1}
/* each name is a label from its own world */
.t-kon{--r:-2deg;font-family:'Pirata One',serif;font-size:clamp(22px,2.3vw,34px);color:#f1d48a;background:#24180f;border:1px solid #7b5b3a}
.t-up{--r:1.5deg;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(22px,2.3vw,34px);color:#5a1830;background:#f5dce3}
.t-why{--r:-1deg;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(17px,1.6vw,23px);color:#151515;background:#fbfaf6}
.t-cv{--r:2deg;font-family:'Anton',sans-serif;font-size:clamp(30px,3.4vw,52px);color:var(--cream);background:var(--red);padding:.05em .4em .08em}
.t-toa{--r:-2deg;font-family:'Permanent Marker',cursive;font-size:clamp(20px,2vw,29px);color:#fff6c9;background:#1b1f4a}

/* the borders that collide, and the frame */
.borders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.borders path{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* the signature crosses every territory and belongs to none */
.sig{position:absolute;pointer-events:none;z-index:5;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.45)) drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.sig .scrap{display:block;padding:7% 9% 8%;background:linear-gradient(160deg,#f1ebdc,#e6dcc6)}
.sig .ink{display:block;aspect-ratio:1075/627;background:#141414;
  -webkit-mask:url(landing/firma.png) center/contain no-repeat;mask:url(landing/firma.png) center/contain no-repeat}

/* Tomás on adventure: the dot that plays */
.player{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:999px;
  background:rgba(10,12,30,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:6}
.dot{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:#fff6c9;display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 0 0 calc(var(--lv) * 12px) rgba(255,246,201,.25),0 4px 14px rgba(0,0,0,.4);transition:transform .2s ease}
.dot:hover{transform:scale(1.06)}
.dot svg{width:18px;height:18px;fill:#141633}
.trk{min-width:0;max-width:220px;line-height:1.25}
.trk .tt{display:block;font-family:'Permanent Marker',cursive;font-size:17px;color:#fff6c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tm{display:block;font-size:12px;font-stretch:86%;color:#b9b7d8;font-variant-numeric:tabular-nums}
.skip{flex:none;width:30px;height:30px;border:0;background:none;cursor:pointer;padding:0;display:grid;place-items:center}
.skip svg{width:13px;height:13px;fill:#e9e7f5}
.eps{display:flex;gap:6px}
.ep{display:block;flex:none;width:26px;height:26px;padding:0;border:0;background:#000;cursor:pointer;opacity:.5;transition:opacity .3s ease}
.ep img{display:block;width:100%;height:100%}
.ep:hover,.ep:focus-visible,.ep.cur{opacity:1}
.ep.cur{outline:2px solid #fff6c9;outline-offset:2px}
.player :focus-visible{outline:2px dashed #fff6c9;outline-offset:3px}

/* a whisper on the frame: how to reach him */
.mail{position:absolute;right:clamp(16px,2.4vw,32px);bottom:clamp(2px,.4vw,6px);z-index:7;font-size:11.5px;font-stretch:90%;letter-spacing:.02em;
  color:rgba(244,236,216,.72);text-decoration:none}
.mail:hover,.mail:focus-visible{color:var(--cream);text-decoration:underline;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (hover:none){ .tag{opacity:1} }
@media (max-width:600px){
  .tag{white-space:normal;text-align:center;max-width:38vw}
  .t-kon,.t-up{font-size:19px}.t-why{font-size:15px}.t-cv{font-size:30px}.t-toa{font-size:17px}
}
@media (max-width:1180px){ .eps{display:none} }
@media (max-width:600px){
  .player{gap:8px;padding:6px 10px 6px 6px}
  .dot{width:48px;height:48px}
  .trk{max-width:120px}.trk .tt{font-size:14px}
  .eps{display:none}
}
@media (prefers-reduced-motion:reduce){ .media>video,.tag{transition:none} }
</style>
</head>

  <svg class="borders" id="borders" aria-hidden="true"></svg>

    <button class="dot" id="pp" type="button" aria-label="Play Tomás on adventure"><svg viewBox="0 0 24 24" id="ppIcon"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>

      <a class="ep" data-ep="outfit" href="https://open.spotify.com/artist/0u3MztL3JelbFfD4odTNO4" target="_blank" rel="noopener" aria-label="An Outfit, on Spotify"><img src="landing/ep-an-outfit-s.jpg" alt="" width="52" height="52"></a>
    </span>
  </div>

  <a class="mail" href="mailto:tomas22becerra@gmail.com">tomas22becerra@gmail.com</a>

<audio id="au" preload="none"></audio>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement, wall = $('#wall'), svg = $('#borders');
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
const touchOnly = matchMedia('(hover: none)').matches;   // no pointer to come close with: the names stay on
let playing = false, active = null, rafOn = false, buf = null, level = 0;

/* ---------- the map of the wall, from Tomás's drawing (percent of the screen, landscape) ---------- */
const BASE = {
  TL: [0, 0], TR: [100, 0], BR: [100, 100], BL: [0, 100],
  p1: [31.4, 0], p2: [37.8, 20.8], p3: [42.6, 40.5], p4: [53.7, 35.7], J: [59, 33.6],
  p5: [66.5, 30.4], p6: [70.7, 53], p7: [87.2, 29.8], p8: [100, 18],
  y1: [0, 62.5], y2: [27.7, 72], y3: [32.4, 55.4], y4: [39.9, 53.6], y5: [56.4, 61.3], y6: [59, 39.9],
  b2: [38.8, 68.5], b3: [42, 74.4], b4: [62.2, 82.7], b5: [62.8, 100],
};
// which edge a point sits on: it may slide along it, never leave it
const EDGE = { TL: 'c', TR: 'c', BR: 'c', BL: 'c', p1: 'top', p8: 'right', y1: 'left', b5: 'bottom' };
const REGIONS = {
  kon: ['TL', 'p1', 'p2', 'p3', 'y4', 'y3', 'y2', 'y1'],
  up: ['p1', 'TR', 'p8', 'p7', 'p6', 'p5', 'J', 'p4', 'p3', 'p2'],
  toa: ['J', 'p5', 'p6', 'p7', 'p8', 'BR', 'b5', 'b4', 'b3', 'b2', 'y4', 'y5', 'y6'],
  cv: ['y1', 'y2', 'y3', 'y4', 'b2', 'b3', 'b4', 'b5', 'BL'],
  why: ['p3', 'p4', 'J', 'y6', 'y5', 'y4'],
};
// the borders: an ink line and, beside it, its colour (as in his drawing)
const BORDERS = [
  { pts: ['p1', 'p2', 'p3', 'p4', 'J', 'p5', 'p6', 'p7', 'p8'], color: 'var(--purple)', off: [6, 4], music: true },
  { pts: ['y1', 'y2', 'y3', 'y4', 'y5', 'y6', 'J'], color: 'var(--yellow)', off: [2, -6], music: true },
  { pts: ['y4', 'b2', 'b3', 'b4', 'b5'], color: 'var(--blue)', off: [6, 2], music: true },
  { pts: ['p3', 'y4'], color: 'var(--red)', off: [-6, 1] },
];
// where each territory says its name, and where the music's dot sits
const TAGS = { kon: [15, 47], up: [70, 13], why: [49.5, 49], cv: [8, 79], toa: [83, 44] };
const TAGS_P = { kon: [34, 7], up: [16, 52], why: [48, 52], cv: [84, 57], toa: [66, 66] };   // phones: the wall turned on its side
const PLAYER = [79, 76], PLAYER_P = [60, 91];
// the signature, on its scrap, pasted over the printed name at the top of the CV
const SIG = { x: 21, y: 67, w: 23, rot: -5 }, SIG_P = { x: 70, y: 30, w: 50, rot: -7 };

let portrait = false, W = 0, H = 0;
const orient = ([x, y]) => portrait ? [y, x] : [x, y];
const edgeOf = k => { const e = EDGE[k]; if (!portrait || !e || e === 'c') return e; return { top: 'left', left: 'top', right: 'bottom', bottom: 'right' }[e]; };
let cur = {}, tgt = {};
function resetPoints() { for (const k in BASE) { cur[k] = orient(BASE[k]); tgt[k] = cur[k].slice(); } }

/* ---------- a small seeded random: the wobble of the hand is the same on every visit ---------- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const jit = BORDERS.map((b, i) => { const r = rng(17 + i * 31); return b.pts.slice(1).map(() => Array.from({ length: 7 }, () => [(r() - .5) * 3, (r() - .5) * 3])); });

/* ---------- regions, their media and their names ---------- */
const regs = {};
document.querySelectorAll('.reg').forEach(el => {
  const k = el.dataset.k;
  const tag = el.querySelector('.tag'); $('#tags').appendChild(tag);   // names live above the wall, so no border cuts them
  regs[k] = { el, k, media: el.querySelector('.media'), img: el.querySelector('.media>img'), video: el.querySelector('video'), tag };
});
const px = ([x, y]) => [x / 100 * W, y / 100 * H];
function layoutStatic() {
  W = innerWidth; H = innerHeight;
  portrait = H > W * 1.1;
  resetPoints();
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  for (const k in REGIONS) {
    const ps = REGIONS[k].map(n => cur[n]);
    const xs = ps.map(p => p[0]), ys = ps.map(p => p[1]);
    const m = 5;   // the picture is a little larger than its territory, so a push never shows its edge
    const l = Math.max(0, Math.min(...xs) - m), t = Math.max(0, Math.min(...ys) - m);
    const r = Math.min(100, Math.max(...xs) + m), b = Math.min(100, Math.max(...ys) + m);
    Object.assign(regs[k].media.style, { left: l + '%', top: t + '%', width: (r - l) + '%', height: (b - t) + '%' });
    const [tx, ty] = portrait ? TAGS_P[k] : TAGS[k];
    Object.assign(regs[k].tag.style, { left: tx + '%', top: ty + '%' });
  }
  const [qx, qy] = portrait ? PLAYER_P : PLAYER;
  Object.assign($('#player').style, { left: qx + '%', top: qy + '%' });
  const sig = $('#sig'), S = portrait ? SIG_P : SIG;
  Object.assign(sig.style, { left: S.x + '%', top: S.y + '%', width: S.w + 'vw', transform: `translate(-50%,-50%) rotate(${S.rot}deg)` });
  tearScrap();
  drawOp(0); sizeOsc();
  render();
}

// the scrap is torn by hand on all four sides
function tearScrap() {
  const r = rng(77), N = 14, pts = [], j = a => (r() * a).toFixed(1);
  for (let i = 0; i <= N; i++) pts.push(`${(i / N * 100).toFixed(1)}% ${j(7)}px`);
  for (let i = 0; i <= N / 2; i++) pts.push(`calc(100% - ${j(6)}px) ${(i / (N / 2) * 100).toFixed(1)}%`);
  for (let i = N; i >= 0; i--) pts.push(`${(i / N * 100).toFixed(1)}% calc(100% - ${j(8)}px)`);
  for (let i = N / 2; i >= 0; i--) pts.push(`${j(6)}px ${(i / (N / 2) * 100).toFixed(1)}%`);
  $('#sigScrap').style.clipPath = `polygon(${pts.join(',')})`;
}

/* ---------- drawing the wall ---------- */
function polyCSS(k) { return 'polygon(' + REGIONS[k].map(n => `${cur[n][0].toFixed(2)}% ${cur[n][1].toFixed(2)}%`).join(',') + ')'; }
const pathEls = BORDERS.map(() => { const g = document.createElementNS(NS, 'g'); svg.appendChild(g);
  const ink = document.createElementNS(NS, 'path'), col = document.createElementNS(NS, 'path'); g.append(ink, col); return { ink, col }; });
const frame = (() => { const g = document.createElementNS(NS, 'g'); svg.appendChild(g);
  const ink = document.createElementNS(NS, 'path'), col = document.createElementNS(NS, 'path'); g.append(ink, col); return { ink, col }; })();
const focusRing = document.createElementNS(NS, 'path'); focusRing.setAttribute('stroke', '#fff'); focusRing.setAttribute('stroke-width', '2'); focusRing.setAttribute('stroke-dasharray', '7 6'); focusRing.style.opacity = 0; svg.appendChild(focusRing);

function borderPts(bi, wave) {
  const b = BORDERS[bi], out = [];
  for (let i = 0; i < b.pts.length - 1; i++) {
    const [x1, y1] = px(cur[b.pts[i]]), [x2, y2] = px(cur[b.pts[i + 1]]);
    const J = jit[bi][i], n = J.length;
    const nx = -(y2 - y1), ny = x2 - x1, nl = Math.hypot(nx, ny) || 1;
    for (let k = 0; k < n; k++) {
      const t = k / n;
      let x = x1 + (x2 - x1) * t + (k ? J[k][0] : 0), y = y1 + (y2 - y1) * t + (k ? J[k][1] : 0);
      if (wave && k) { const s = wave(out.length); x += nx / nl * s; y += ny / nl * s; }
      out.push([x, y]);
    }
  }
  out.push(px(cur[b.pts[b.pts.length - 1]]));
  return out;
}
const toD = pts => 'M' + pts.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' L');
const thick = () => (Math.min(W, H) < 600 ? 3 : 4.2);
function render() {
  for (const k in REGIONS) regs[k].el.style.clipPath = polyCSS(k);
  const t = thick();
  BORDERS.forEach((b, i) => {
    const wave = playing && b.music && buf && !reduce ? (j => buf[(j * 37 + i * 211) % (buf.length >> 1)] * (5 + level * 12)) : null;
    const pts = borderPts(i, wave);
    const { ink, col } = pathEls[i];
    ink.setAttribute('d', toD(pts)); ink.setAttribute('stroke', '#0d0d0d'); ink.setAttribute('stroke-width', t + 1);
    const [ox, oy] = portrait ? [b.off[1], b.off[0]] : b.off;
    col.setAttribute('d', toD(pts.map(([x, y]) => [x + ox * t / 4.2, y + oy * t / 4.2]))); col.setAttribute('stroke', b.color); col.setAttribute('stroke-width', t + .4);
  });
  // the frame: black at the edge, green just inside, both drawn by hand
  const e = Math.min(W, H) < 600 ? 7 : 11, g = e + t * 1.8;
  const box = (m, r) => { const R = rng(r); const w = () => (R() - .5) * 3;
    return toD([[m + w(), m + w()], [W * .5, m + w()], [W - m + w(), m + w()], [W - m + w(), H * .5], [W - m + w(), H - m + w()], [W * .5, H - m + w()], [m + w(), H - m + w()], [m + w(), H * .5], [m + w(), m + w()]]); };
  frame.ink.setAttribute('d', box(e, 5)); frame.ink.setAttribute('stroke', '#0d0d0d'); frame.ink.setAttribute('stroke-width', t + 3);
  frame.col.setAttribute('d', box(g, 9)); frame.col.setAttribute('stroke', 'var(--green)'); frame.col.setAttribute('stroke-width', t + .4);
  if (active && active._focus) focusRing.setAttribute('d', toD(REGIONS[active.k].map(n => px(cur[n]))) + ' Z');
}

/* the borders draw themselves once, when the wall appears */
function drawIn() {
  if (reduce) return;
  const all = [...pathEls.flatMap(p => [p.ink, p.col]), frame.ink, frame.col];
  all.forEach((p, i) => {
    const L = p.getTotalLength();
    p.animate([{ strokeDasharray: `${L} ${L}`, strokeDashoffset: L }, { strokeDasharray: `${L} ${L}`, strokeDashoffset: 0 }],
      { duration: 900 + (i % 2) * 160, delay: 120 + Math.floor(i / 2) * 110, easing: 'cubic-bezier(.6,.1,.3,1)' });
  });
  $('#sigInk').animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 1300, delay: 900, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'backwards' });
  $('#sig').animate([{ opacity: 0, transform: $('#sig').style.transform + ' scale(1.04)' }, { opacity: 1, transform: $('#sig').style.transform }], { duration: 500, delay: 500, easing: 'ease-out', fill: 'backwards' });
}

/* ---------- territories fight for space: the one you look at pushes the others back ---------- */
function pushFor(k) {
  for (const n in BASE) tgt[n] = orient(BASE[n]).slice();
  if (!k) return;
  const ps = REGIONS[k].map(n => orient(BASE[n]));
  const cx = ps.reduce((a, p) => a + p[0], 0) / ps.length, cy = ps.reduce((a, p) => a + p[1], 0) / ps.length;
  const mag = Math.min(W, H) * .055;
  for (const n of REGIONS[k]) {
    const e = edgeOf(n); if (e === 'c') continue;
    const [bx, by] = orient(BASE[n]);
    let dx = (bx - cx) / 100 * W, dy = (by - cy) / 100 * H; const l = Math.hypot(dx, dy) || 1;
    dx = dx / l * mag / W * 100; dy = dy / l * mag / H * 100;
    if (e === 'top' || e === 'bottom') dy = 0;
    if (e === 'left' || e === 'right') dx = 0;
    tgt[n] = [bx + dx, by + dy];
  }
}
let moving = false;
function settle() {
  if (moving) return; moving = true;
  const step = () => {
    let d = 0;
    for (const n in cur) {
      const c = cur[n], t = tgt[n];
      const ex = t[0] - c[0], ey = t[1] - c[1];
      c[0] += ex * (reduce ? 1 : .16); c[1] += ey * (reduce ? 1 : .16); d = Math.max(d, Math.abs(ex), Math.abs(ey));
    }
    if (!playing) render();
    if (d > .02) requestAnimationFrame(step); else { moving = false; if (!playing) render(); }
  };
  requestAnimationFrame(step);
}

const PANS = {
  cv: { frames: [{ objectPosition: '50% 0%' }, { objectPosition: '50% 100%' }], dur: 16000 },
  why: { frames: [{ objectPosition: '44% 50%' }, { objectPosition: '78% 40%' }, { objectPosition: '20% 60%' }], dur: 15000 },
};
function activate(k, viaFocus) {
  const R = regs[k]; if (!R) return;
  if (active === R) { R._focus = viaFocus || R._focus; return; }
  if (active) deactivate(active.k);
  active = R; R._focus = !!viaFocus;
  R.el.classList.add('on'); R.tag.classList.add('on'); wall.classList.add('has-on');
  focusRing.style.opacity = viaFocus ? 1 : 0;
  pushFor(k); settle();
  if (R.video) {
    if (!R.video.src) { R.video.src = R.video.dataset.src; R.video.preload = 'auto'; }
    R.video.play().then(() => { if (active === R) R.video.classList.add('live'); }).catch(() => {});
  }
  if (PANS[k] && !reduce) R._pan = R.img.animate(PANS[k].frames, { duration: PANS[k].dur, easing: 'ease-in-out', direction: 'alternate', iterations: Infinity });
  if (k === 'up') opRun(true);
}
function deactivate(k) {
  const R = regs[k]; if (!R) return;
  R.el.classList.remove('on'); if (!touchOnly) R.tag.classList.remove('on');
  if (R.video) { R.video.pause(); R.video.classList.remove('live'); }
  if (R._pan) { R._pan.cancel(); R._pan = null; }
  if (k === 'up') opRun(false);
  if (active === R) { active = null; wall.classList.remove('has-on'); focusRing.style.opacity = 0; pushFor(null); settle(); }
}
// the pointer: whichever territory is under it (the borders cross, so we ask the wall, not the element)
function inPoly(x, y, k) {
  const ps = REGIONS[k].map(n => cur[n]); let ins = false;
  for (let i = 0, j = ps.length - 1; i < ps.length; j = i++) {
    const [xi, yi] = ps[i], [xj, yj] = ps[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}
let leaveT = 0;
if (finePointer) {
  wall.addEventListener('pointermove', e => {
    if (e.target.closest('.player') || e.target.closest('.mail')) return;
    const x = e.clientX / W * 100, y = e.clientY / H * 100;
    const k = Object.keys(REGIONS).find(k => inPoly(x, y, k));
    clearTimeout(leaveT);
    if (k && (!active || active.k !== k)) activate(k);
  });
  wall.addEventListener('pointerleave', () => { leaveT = setTimeout(() => active && deactivate(active.k), 150); });
}
document.querySelectorAll('a.reg').forEach(a => {
  a.addEventListener('focus', () => { if (a.matches(':focus-visible')) activate(a.dataset.k, true); });
  a.addEventListener('blur', () => { if (active && active.k === a.dataset.k) deactivate(a.dataset.k); });
});

/* ---------- Unfinished Paragraphs: an op-art field in the colours of the seven stories ---------- */
const STORIES = [   // background and ink of each story, from the page's own palettes
  ['#f5dce3', '#a63053'], ['#3a1922', '#e0bd76'], ['#ead6ae', '#8a4a15'], ['#2a3036', '#aab6c2'],
  ['#d6e5c9', '#36702f'], ['#161815', '#8fb36c'], ['#121c27', '#e5a852'],
];
const op = $('#op'); let opCtx = null, opPhase = 0, opOn = false, opLast = 0;
function drawOp(phase) {
  const box = regs.up.media.getBoundingClientRect(); if (!box.width) return;
  const d = Math.min(2, devicePixelRatio || 1), w = Math.round(box.width * d), h = Math.round(box.height * d);
  if (op.width !== w || op.height !== h) { op.width = w; op.height = h; }
  const c = opCtx || (opCtx = op.getContext('2d'));
  // seven slanted bands of colour
  const bg = c.createLinearGradient(0, h * .2, w, h * .8), ink = c.createLinearGradient(0, h * .2, w, h * .8);
  STORIES.forEach(([b, a], i) => { const s0 = i / 7, s1 = (i + 1) / 7; bg.addColorStop(s0, b); bg.addColorStop(s1 - .001, b); ink.addColorStop(s0, a); ink.addColorStop(s1 - .001, a); });
  c.fillStyle = bg; c.fillRect(0, 0, w, h);
  // Riley's waves: parallel lines whose swing swells and narrows across the field
  const gap = 7 * d, n = Math.ceil(h / gap) + 6;
  c.strokeStyle = ink; c.lineWidth = 1.7 * d;
  for (let i = -3; i < n; i++) {
    const y0 = i * gap;
    c.beginPath();
    for (let x = 0; x <= w; x += 4 * d) {
      const u = x / w, swell = Math.pow(Math.sin(Math.PI * (u * 1.3 + .1 + .05 * Math.sin(i * .21 + phase * .4))), 2);
      const y = y0 + swell * 11 * d * Math.sin(u * 22 + i * .33 + phase);
      x ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.stroke();
  }
}
function opRun(on) {
  opOn = on && !reduce;
  if (opOn) { opLast = performance.now(); requestAnimationFrame(function tick(t) { if (!opOn) return; opPhase += (t - opLast) / 1000 * 1.1; opLast = t; drawOp(opPhase); requestAnimationFrame(tick); }); }
}

/* ---------- Tomás on adventure ---------- */
// The first play of every visit drops into Compass reach at 1:05 (on the beat at 65.06 s).
const FIRST_START = 64.96;
const MASTER = .62;   // overall level of the player (Tomás, 21/10: a bit lower)
const EPS = {
  cartography: { title: 'Cartography', cover: 'landing/ep-cartography.jpg' },
  quantum: { title: 'Something wrong with the quantum machine', cover: 'landing/ep-quantum-machine.jpg' },
  sillage: { title: 'Madame Sillage', cover: 'landing/ep-madame-sillage.jpg' },
  outfit: { title: 'An Outfit', cover: 'landing/ep-an-outfit.jpg' },
};
const TRACKS = [
  { title: 'Compass reach', ep: 'cartography', src: 'music/compass-reach.m4a', gain: 1 },
  { title: 'So much natural machinery', ep: 'cartography', src: 'music/so-much-natural-machinery.m4a', gain: 1 },
  { title: 'Royal beasts', ep: 'cartography', src: 'music/royal-beasts.m4a', gain: .79 },   // mastered 2 dB louder than the rest
  { title: 'A blue extension', ep: 'quantum', src: 'music/a-blue-extension.m4a', gain: 1 },
];
const toa = $('#toa'), au = $('#au'), pp = $('#pp'), ppIcon = $('#ppIcon'), tt = $('#tt'), tm = $('#tm'), nextBtn = $('#next');
const cover = $('#cover'), osc = $('#osc'), epBtns = [...document.querySelectorAll('.ep')];
const ICON_PLAY = 'M7 4.5v15l12.5-7.5z', ICON_PAUSE = 'M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z';
let ti = 0, actx = null, analyser = null, gainNode = null, fbuf = null, pendingStart = null, started = false;
let avg = -1, dev = .05, lastT = 0, warmFrom = 0;
function markEP(key) { for (const b of epBtns) b.classList.toggle('cur', b.dataset.ep === key); }
function showEP(key) {
  markEP(key);
  if (cover.dataset.ep === key) return;
  cover.dataset.ep = key; cover.classList.add('swap');
  setTimeout(() => { cover.src = EPS[key].cover; }, 260);
}
cover.addEventListener('load', () => cover.classList.remove('swap'));
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
function setTrack(i, autoplay, at) {
  ti = (i + TRACKS.length) % TRACKS.length;
  pendingStart = at || null;
  au.src = TRACKS[ti].src + (at ? `#t=${at}` : '');
  tt.textContent = TRACKS[ti].title; tm.textContent = EPS[TRACKS[ti].ep].title;
  showEP(TRACKS[ti].ep);
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[ti].title, artist: 'Tomás on adventure', album: EPS[TRACKS[ti].ep].title });
  if (autoplay) play();
}
function ensureAudioGraph() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(au);
    gainNode = actx.createGain();
    analyser = actx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .6;
    analyser.minDecibels = -85; analyser.maxDecibels = -12;
    buf = new Float32Array(analyser.fftSize); fbuf = new Uint8Array(analyser.frequencyBinCount);
    src.connect(gainNode); gainNode.connect(analyser); analyser.connect(actx.destination);
  } catch (e) { actx = null; analyser = null; gainNode = null; }
}
function fadeIn() {
  const g = TRACKS[ti].gain * MASTER;
  if (gainNode) { const now = actx.currentTime; gainNode.gain.cancelScheduledValues(now); gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(g, now + .12); }
  else au.volume = g;
}
function play() {
  if (!started) { started = true; setTrack(0, false, FIRST_START); }
  else if (!au.src) setTrack(ti, false);
  ensureAudioGraph();
  if (actx && actx.state === 'suspended') actx.resume();
  fadeIn(); au.play().catch(() => {});
}
function toggle() { au.paused ? play() : au.pause(); }
function reflect() {
  playing = !au.paused;
  toa.classList.toggle('playing', playing);
  ppIcon.firstElementChild.setAttribute('d', playing ? ICON_PAUSE : ICON_PLAY);
  pp.setAttribute('aria-label', `${playing ? 'Pause' : 'Play'} Tomás on adventure`);
  if (playing) wake(); else render();
}
pp.addEventListener('click', toggle);
nextBtn.addEventListener('click', () => { started = true; setTrack(ti + 1, true); });
au.addEventListener('play', reflect); au.addEventListener('pause', reflect);
au.addEventListener('ended', () => setTrack(ti + 1, true));
au.addEventListener('timeupdate', () => { tm.textContent = `${fmt(au.currentTime)} / ${fmt(au.duration)}`; });
au.addEventListener('loadedmetadata', () => { if (pendingStart != null && Math.abs(au.currentTime - pendingStart) > .5) au.currentTime = pendingStart; pendingStart = null; });
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('nexttrack', () => { started = true; setTrack(ti + 1, true); });
  navigator.mediaSession.setActionHandler('previoustrack', () => { started = true; setTrack(ti - 1, true); });
}
for (const e of epBtns) {
  e.title = EPS[e.dataset.ep].title + (e.tagName === 'A' ? ', on Spotify' : '');
  if (e.tagName !== 'BUTTON') continue;
  e.addEventListener('click', () => {
    const k = e.dataset.ep;
    if (started && TRACKS[ti].ep === k) { toggle(); return; }
    if (!started && k === TRACKS[0].ep) { play(); return; }   // the first play still drops into Compass reach at 1:05
    started = true; setTrack(TRACKS.findIndex(t => t.ep === k), true);
  });
}
markEP(TRACKS[0].ep);

/* the ring of light around the dot, drawn by the waveform over the cover */
let og = null, oW = 0, oH = 0, dpr = 1;
function sizeOsc() {
  dpr = Math.min(2, devicePixelRatio || 1);
  const r = regs.toa.media.getBoundingClientRect(); if (!r.width) return;
  oW = osc.width = Math.round(r.width * dpr); oH = osc.height = Math.round(r.height * dpr);
  og = osc.getContext('2d'); og.clearRect(0, 0, oW, oH);
}
function ringCentre() {
  const m = regs.toa.media.getBoundingClientRect(), d = pp.getBoundingClientRect();
  return [(d.left + d.width / 2 - m.left) * dpr, (d.top + d.height / 2 - m.top) * dpr];
}
function drawRing() {
  if (!og) return;
  og.globalCompositeOperation = 'destination-out'; og.fillStyle = 'rgba(0,0,0,.22)'; og.fillRect(0, 0, oW, oH);
  og.globalCompositeOperation = 'source-over';
  const [cx, cy] = ringCentre(), R = Math.min(oW, oH) * .28, N = 220, g = .42 + level * .38;
  for (const [a, w] of [[.18, 10], [.95, 1.6]]) {
    og.beginPath();
    for (let i = 0; i <= N; i++) {
      const th = i / N * Math.PI * 2 - Math.PI / 2, j = Math.floor((i % N) / N * (buf.length - 16) * .5);
      let s = 0; for (let q = 0; q < 12; q++) s += buf[j + q]; s /= 12;
      const rr = R * (1 + s * g), x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
      i ? og.lineTo(x, y) : og.moveTo(x, y);
    }
    og.closePath(); og.strokeStyle = `rgb(255 246 201 / ${a})`; og.lineWidth = w * dpr; og.stroke();
  }
}

/* one loop while the music plays: the ring, the dot, and the borders that tremble with it */
function wake() { if (!rafOn) { rafOn = true; requestAnimationFrame(loop); } }
function loop(t) {
  const tPrev = lastT; lastT = t;
  if (!(playing && analyser)) { rafOn = false; level = 0; root.style.setProperty('--lv', '0'); if (og) og.clearRect(0, 0, oW, oH); render(); return; }
  analyser.getFloatTimeDomainData(buf); analyser.getByteFrequencyData(fbuf);
  let lo = 0; for (let i = 1; i < 9; i++) lo += fbuf[i]; lo /= 8 * 255;
  const dt = Math.min(.1, (t - tPrev) / 1000 || .016), ease = tau => 1 - Math.exp(-dt / tau);
  if (avg < 0) { if (lo < .03) { requestAnimationFrame(loop); return; } avg = lo; dev = .04; warmFrom = t; }
  const tau = t - warmFrom < 1500 ? .3 : 2.5;
  avg += (lo - avg) * ease(tau); dev += (Math.abs(lo - avg) - dev) * ease(tau);
  const target = Math.min(1, Math.max(0, .38 + (lo - avg) / (2.6 * dev + .004)));
  level += (target - level) * (target > level ? ease(.06) : ease(.35));
  if (!reduce) root.style.setProperty('--lv', level.toFixed(3));
  drawRing(); render();
  requestAnimationFrame(loop);
}

/* ---------- start ---------- */
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const k = active && active.k; layoutStatic(); if (k) { pushFor(k); settle(); } }, 120); });
layoutStatic(); drawIn();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => drawOp(opPhase));
if (finePointer && !(navigator.connection && navigator.connection.saveData)) {
  addEventListener('load', () => setTimeout(() => { const v = regs.kon.video; if (v && !v.src) { v.src = v.dataset.src; v.preload = 'auto'; } }, 2500));
}
})();
</script>
</body>
